name: Release
run-name: Release ${{ github.event.release.tag_name }}

on:
  release:
    types:
      - published

permissions:
  contents: write

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/proxysql-mysqlbinlog
  RELEASE_TAG: ${{ github.event.release.tag_name }}

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build distro packages (.deb/.rpm) and attach them to the release.
  # ---------------------------------------------------------------------------
  package:
    name: package (${{ matrix.distro }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: centos9
            arch: amd64
            runner: ubuntu-latest
          - distro: centos10
            arch: amd64
            runner: ubuntu-latest
          - distro: debian12
            arch: amd64
            runner: ubuntu-latest
          - distro: debian13
            arch: amd64
            runner: ubuntu-latest
          - distro: ubuntu22
            arch: amd64
            runner: ubuntu-latest
          - distro: ubuntu24
            arch: amd64
            runner: ubuntu-latest
          - distro: debian13
            arch: arm64
            runner: ubuntu-24.04-arm
          - distro: ubuntu24
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out source at release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Build ${{ matrix.distro }} toolchain image
        run: |
          docker build \
            -t proxysql/proxysql-mysqlbinlog:build-${{ matrix.distro }} \
            -f docker/build/build-${{ matrix.distro }}/Dockerfile \
            .

      - name: Build ${{ matrix.distro }} package
        run: make ${{ matrix.distro }}

      - name: Verify package contents
        run: |
          set -euo pipefail
          shopt -s nullglob
          case "${{ matrix.distro }}" in
            centos*) packages=(binaries/*.rpm) ;;
            *) packages=(binaries/*.deb) ;;
          esac
          if [[ ${#packages[@]} -ne 1 ]]; then
            echo "expected exactly one package for ${{ matrix.distro }}, found ${#packages[@]}" >&2
            printf '%s\n' "${packages[@]}" >&2
            exit 1
          fi
          test/verify-package-contents.sh "${packages[0]}"

      - name: Inspect package metadata
        run: |
          set -euo pipefail
          shopt -s nullglob
          case "${{ matrix.distro }}" in
            centos*) packages=(binaries/*.rpm) ;;
            *) packages=(binaries/*.deb) ;;
          esac
          if [[ ${#packages[@]} -ne 1 ]]; then
            echo "expected exactly one package for ${{ matrix.distro }}, found ${#packages[@]}" >&2
            printf "%s\n" "${packages[@]}" >&2
            exit 1
          fi
          test/verify-package-dependencies.sh "${packages[0]}"

      - name: List built artifacts
        run: ls -l binaries/

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.distro }}-${{ matrix.arch }}
          path: |
            binaries/*.deb
            binaries/*.rpm
          if-no-files-found: error

      - name: Upload package to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          assets=( binaries/*.deb binaries/*.rpm )
          if [ ${#assets[@]} -eq 0 ]; then
            echo "no package assets to upload"
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber

  # ---------------------------------------------------------------------------
  # 2. Build container images locally and SAVE them as artifacts.
  #    Nothing is pushed here; images reach GHCR only after they pass the tests.
  # ---------------------------------------------------------------------------
  container-build:
    name: container-build (${{ matrix.distro }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: centos9
            arch: amd64
            runner: ubuntu-latest
          - distro: centos10
            arch: amd64
            runner: ubuntu-latest
          - distro: debian12
            arch: amd64
            runner: ubuntu-latest
          - distro: debian13
            arch: amd64
            runner: ubuntu-latest
          - distro: ubuntu22
            arch: amd64
            runner: ubuntu-latest
          - distro: ubuntu24
            arch: amd64
            runner: ubuntu-latest
          - distro: debian13
            arch: arm64
            runner: ubuntu-24.04-arm
          - distro: ubuntu24
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out source at release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: package-${{ matrix.distro }}-${{ matrix.arch }}
          path: binaries/

      - name: Build image (load locally, no push)
        run: make -C docker/images mysqlbinlog-${{ matrix.distro }} IMAGE_PREFIX="${IMAGE_PREFIX}"

      - name: Create architecture staging tag
        run: |
          staging_image="${IMAGE_PREFIX}:staging-${RELEASE_TAG}-${{ matrix.distro }}-${{ matrix.arch }}"
          docker tag "${IMAGE_PREFIX}:${{ matrix.distro }}" "$staging_image"
          echo "STAGING_IMAGE=$staging_image" >> "$GITHUB_ENV"

      - name: Remove non-staging tags
        run: |
          set -euo pipefail
          mapfile -t tags < <(docker image ls --format '{{.Repository}}:{{.Tag}}' "${IMAGE_PREFIX}")
          for tag in "${tags[@]}"; do
            [ "$tag" = "$STAGING_IMAGE" ] || docker image rm "$tag"
          done
          docker image inspect "$STAGING_IMAGE"

      - name: Save staged image to tarball
        run: |
          mkdir -p images
          docker save "$STAGING_IMAGE" -o "images/image-${{ matrix.distro }}-${{ matrix.arch }}.tar"
          ls -lh images/

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.distro }}-${{ matrix.arch }}
          path: images/image-${{ matrix.distro }}-${{ matrix.arch }}.tar
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 3. Test every built image with the TAP suite.
  # ---------------------------------------------------------------------------
  test-images:
    name: test-images
    runs-on: ubuntu-latest
    needs: container-build
    env:
      MYSQL_VERSION: "84"
      RUNNER_IMG: proxysql/proxysql-mysqlbinlog:build-ubuntu24
    steps:
      - name: Check out source at release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Build TAP toolchain image
        run: |
          docker build \
            -t "$RUNNER_IMG" \
            -f docker/build/build-ubuntu24/Dockerfile \
            .

      - name: Load all built images
        uses: ./.github/actions/load-images

      - name: Restore AMD64 distro tags for TAP
        run: |
          set -euo pipefail
          for distro in centos9 centos10 debian12 debian13 ubuntu22 ubuntu24; do
            docker tag \
              "${IMAGE_PREFIX}:staging-${RELEASE_TAG}-${distro}-amd64" \
              "${IMAGE_PREFIX}:${distro}"
          done

      - name: Build TAP test binaries
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/opt/proxysql_mysqlbinlog \
            -w /opt/proxysql_mysqlbinlog/test/tap \
            "$RUNNER_IMG" make

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build infra image
        uses: docker/build-push-action@v6
        with:
          context: test/infra
          file: test/infra/Dockerfile.infra
          tags: proxysql-binlog-reader-infra:latest
          load: true
          cache-from: type=gha,scope=test-infra
          cache-to: type=gha,mode=max,scope=test-infra

      - name: Test centos9
        if: ${{ !cancelled() }}
        run: DISTROS=centos9 bash test/infra/docker-image-test.sh

      - name: Test centos10
        if: ${{ !cancelled() }}
        run: DISTROS=centos10 bash test/infra/docker-image-test.sh

      - name: Test debian12
        if: ${{ !cancelled() }}
        run: DISTROS=debian12 bash test/infra/docker-image-test.sh

      - name: Test debian13
        if: ${{ !cancelled() }}
        run: DISTROS=debian13 bash test/infra/docker-image-test.sh

      - name: Test ubuntu22
        if: ${{ !cancelled() }}
        run: DISTROS=ubuntu22 bash test/infra/docker-image-test.sh

      - name: Test ubuntu24
        if: ${{ !cancelled() }}
        run: DISTROS=ubuntu24 bash test/infra/docker-image-test.sh

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-test-logs
          path: test/logs/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 4. Verify the native ARM64 runtime images before publishing them.
  # ---------------------------------------------------------------------------
  arm64-smoke:
    name: arm64-smoke (${{ matrix.distro }})
    runs-on: ubuntu-24.04-arm
    needs: container-build
    strategy:
      fail-fast: false
      matrix:
        distro: [debian13, ubuntu24]
    steps:
      - name: Download ARM64 image
        uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.distro }}-arm64
          path: images/

      - name: Load ARM64 image
        run: docker load -i "images/image-${{ matrix.distro }}-arm64.tar"

      - name: Smoke test ARM64 runtime image
        run: |
          # `-v` prints the version and returns 1, so it cannot be the last
          # command under `sh -e`. Pipe it into grep instead: that asserts the
          # binary runs AND reports the expected release version, and the
          # pipeline's status is grep's. Without the version match this would
          # also pass on a stale binary left in the image.
          docker run --rm --entrypoint sh \
            --env EXPECTED_VERSION="${RELEASE_TAG}" \
            "${IMAGE_PREFIX}:staging-${RELEASE_TAG}-${{ matrix.distro }}-arm64" \
            -ec 'test "$(dpkg --print-architecture)" = arm64; command -v proxysql_binlog_reader; proxysql_binlog_reader -v | grep -q "^proxysql_binlog_reader version ${EXPECTED_VERSION}"'

  # ---------------------------------------------------------------------------
  # 5. Publish: push verified staging images, then create stable manifests.
  # ---------------------------------------------------------------------------
  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: [test-images, arm64-smoke]
    permissions:
      packages: write
    steps:
      - name: Check out source at release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Load all built images
        uses: ./.github/actions/load-images

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Push verified staging images
        run: docker push --all-tags "${IMAGE_PREFIX}"

      - name: Create multi-architecture release manifests
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"

          staging_image() {
            local distro=$1 arch=$2
            echo "${IMAGE_PREFIX}:staging-${RELEASE_TAG}-${distro}-${arch}"
          }

          publish_manifest() {
            local tag=$1
            shift
            docker buildx imagetools create --tag "${IMAGE_PREFIX}:${tag}" "$@"
          }

          publish_amd64() {
            local distro=$1
            shift
            for tag in "$@"; do
              publish_manifest "$tag" "$(staging_image "$distro" amd64)"
            done
          }

          publish_multiarch() {
            local distro=$1
            shift
            for tag in "$@"; do
              publish_manifest "$tag" \
                "$(staging_image "$distro" amd64)" \
                "$(staging_image "$distro" arm64)"
            done
          }

          publish_amd64 centos9 centos9 "${version}-centos9"
          publish_amd64 centos10 centos10 centos "${version}-centos10" "${version}-centos"
          publish_amd64 debian12 debian12 "${version}-debian12"
          publish_multiarch debian13 "${version}" latest debian13 debian "${version}-debian13" "${version}-debian"
          publish_amd64 ubuntu22 ubuntu22 "${version}-ubuntu22"
          publish_multiarch ubuntu24 ubuntu24 ubuntu "${version}-ubuntu24" "${version}-ubuntu"

      - name: Verify public GHCR access
        run: test/verify-ghcr-public-access.sh "${IMAGE_PREFIX}:latest"
