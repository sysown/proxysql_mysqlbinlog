name: CI - Test

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-contract:
    name: workflow contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify release workflow contract
        run: ruby test/verify-release-workflow.rb

      - name: Verify GHCR access checker
        run: test/verify-ghcr-public-access-test.sh

  packages:
    name: package (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: workflow-contract
    strategy:
      fail-fast: false
      matrix:
        target: [centos9, centos10, debian12, debian13, ubuntu22, ubuntu24]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build ${{ matrix.target }} toolchain image
        run: |
          docker build \
            -t proxysql/proxysql-mysqlbinlog:build-${{ matrix.target }} \
            -f docker/build/build-${{ matrix.target }}/Dockerfile \
            .

      - name: Build ${{ matrix.target }} package
        run: make build-${{ matrix.target }}

      - name: Verify static Connector/C linkage
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/opt/proxysql_mysqlbinlog \
            -w /opt/proxysql_mysqlbinlog \
            proxysql/proxysql-mysqlbinlog:build-${{ matrix.target }} \
            bash -lc 'make verify-static-connector-c'

      - name: Verify package contents
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/opt/proxysql_mysqlbinlog:ro \
            -w /opt/proxysql_mysqlbinlog \
            proxysql/proxysql-mysqlbinlog:build-${{ matrix.target }} \
            bash -lc '
              set -euo pipefail
              shopt -s nullglob
              case "${{ matrix.target }}" in
                centos*) packages=(binaries/*.rpm) ;;
                *) packages=(binaries/*.deb) ;;
              esac
              if [[ ${#packages[@]} -ne 1 ]]; then
                echo "expected exactly one package for ${{ matrix.target }}, found ${#packages[@]}" >&2
                printf "%s\\n" "${packages[@]}" >&2
                exit 1
              fi
              test/verify-package-contents.sh "${packages[0]}"
            '

      - name: Inspect package metadata
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/opt/proxysql_mysqlbinlog:ro \
            -w /opt/proxysql_mysqlbinlog \
            proxysql/proxysql-mysqlbinlog:build-${{ matrix.target }} \
            bash -lc '
              set -euo pipefail
              shopt -s nullglob
              case "${{ matrix.target }}" in
                centos*) packages=(binaries/*.rpm) ;;
                *) packages=(binaries/*.deb) ;;
              esac
              if [[ ${#packages[@]} -ne 1 ]]; then
                echo "expected exactly one package for ${{ matrix.target }}, found ${#packages[@]}" >&2
                printf "%s\\n" "${packages[@]}" >&2
                exit 1
              fi
              test/verify-package-dependencies.sh "${packages[0]}"
            '

  test:
    name: test
    runs-on: ubuntu-latest
    needs: workflow-contract
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------------
      # Builds
      # ------------------------------------------------------------------

      # Build the toolchain from this checkout so the reader and TAP
      # binaries use the same Connector/C version as the runtime image.
      - name: Build Ubuntu 24 toolchain image
        run: |
          docker build \
            -t proxysql/proxysql-mysqlbinlog:build-ubuntu24 \
            -f docker/build/build-ubuntu24/Dockerfile \
            .

      - name: Build and inspect vendored reader
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/opt/proxysql_mysqlbinlog \
            -w /opt/proxysql_mysqlbinlog \
            proxysql/proxysql-mysqlbinlog:build-ubuntu24 \
            bash -lc 'make cleanbuild && make -j2 && make verify-static-connector-c && test/verify-shutdown-handshake.sh && make -C test/tap'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build infra Docker image
        uses: docker/build-push-action@v6
        with:
          context: test/infra
          file: test/infra/Dockerfile.infra
          tags: proxysql-binlog-reader-infra:latest
          load: true
          cache-from: type=gha,scope=test-infra
          cache-to: type=gha,mode=max,scope=test-infra

      - name: Build runner Docker image
        uses: docker/build-push-action@v6
        with:
          context: test/infra
          file: test/infra/Dockerfile.runner
          tags: proxysql-binlog-reader-runner:latest
          load: true
          cache-from: type=gha,scope=test-runner
          cache-to: type=gha,mode=max,scope=test-runner

      # ------------------------------------------------------------------
      # Tests — one step per MySQL version so failures are visible in the
      # workflow run UI.  Each result is a required signal for this branch;
      # do not mask later failures with continue-on-error.
      #
      # All steps share a single RUN_ID, producing one log tree:
      #   test/logs/ci-<ts>/
      #     runner.log          (appended per version via tee -a)
      #     mysql-<V>/          (one subdir per version, naturally separated by run.sh)
      # ------------------------------------------------------------------

      - name: Generate run ID
        run: |
          RUN_ID="ci-$(date -u +%Y%m%dT%H%M%SZ)"
          echo "RUN_ID=${RUN_ID}" >> "$GITHUB_ENV"
          mkdir -p "test/logs/${RUN_ID}"

      - name: Test MySQL 5.7
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        env:
          MYSQL_VERSIONS: '57'
        run: |
          set -e
          cd test/infra
          cleanup() { docker compose down -v 2>/dev/null; }
          trap cleanup EXIT
          docker compose up -d mysql
          docker compose run --rm runner

      - name: Test MySQL 8.0
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        env:
          MYSQL_VERSIONS: '80'
        run: |
          set -e
          cd test/infra
          cleanup() { docker compose down -v 2>/dev/null; }
          trap cleanup EXIT
          docker compose up -d mysql
          docker compose run --rm runner

      - name: Test MySQL 8.4
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        env:
          MYSQL_VERSIONS: '84'
        run: |
          set -e
          cd test/infra
          cleanup() { docker compose down -v 2>/dev/null; }
          trap cleanup EXIT
          docker compose up -d mysql
          docker compose run --rm runner

      - name: Test MySQL 9.0
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        env:
          MYSQL_VERSIONS: '90'
        run: |
          set -e
          cd test/infra
          cleanup() { docker compose down -v 2>/dev/null; }
          trap cleanup EXIT
          docker compose up -d mysql
          docker compose run --rm runner

      - name: Test MySQL 9.4
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        env:
          MYSQL_VERSIONS: '94'
        run: |
          set -e
          cd test/infra
          cleanup() { docker compose down -v 2>/dev/null; }
          trap cleanup EXIT
          docker compose up -d mysql
          docker compose run --rm runner

      # ------------------------------------------------------------------
      # Artifacts
      # ------------------------------------------------------------------

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: test/logs/
